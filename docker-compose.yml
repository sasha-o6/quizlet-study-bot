version: '3.8'

services:
  app:
    build: .
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - BOT_TOKEN=${BOT_TOKEN}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - NODE_ENV=production
    depends_on:
      - db
    volumes:
      - ./pg_data:/var/lib/postgresql/data # Ensure database persistence if db volume fails (redundant but safe)

  # flaresolverr:
  #   image: ghcr.io/flaresolverr/flaresolverr:v3.3.15
  #   container_name: flaresolverr
  #   environment:
  #     - LOG_LEVEL=info
  #     - LOG_HTML=false
  #     - CAPTCHA_SOLVER=none
  #     - TZ=Europe/London
  #     - HOST_chromium_headless=true
  #   ports:
  #     - "8191:8191"
  #   restart: always

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./backups/latest.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432" # Optional: Expose for local debugging
