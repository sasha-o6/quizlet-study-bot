services:
  app:
    build: .
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - BOT_TOKEN=${BOT_TOKEN}
      - NODE_ENV=production
      - WEBAPP_URL=${WEBAPP_URL:-https://your-ngrok-url.app}
      - BRIGHTDATA_API_ZONE=${BRIGHTDATA_API_ZONE}
      - BRIGHTDATA_API_URL=${BRIGHTDATA_API_URL}
      - BRIGHTDATA_API_KEY=${BRIGHTDATA_API_KEY}
    depends_on:
      - db
    volumes:
      - ./pg_data:/var/lib/postgresql/data # Ensure database persistence if db volume fails (redundant but safe)

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./backups/latest.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432" # Optional: Expose for local debugging

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - BOT_TOKEN=${BOT_TOKEN}
      - BRIGHTDATA_API_ZONE=${BRIGHTDATA_API_ZONE}
      - BRIGHTDATA_API_URL=${BRIGHTDATA_API_URL}
      - BRIGHTDATA_API_KEY=${BRIGHTDATA_API_KEY}
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:80"
